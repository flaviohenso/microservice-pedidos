# Perfil de testes de integração
# O schema continua sendo gerado pelo Hibernate (igual à produção atual: ddl-auto=update)

# Outbox só roda quando o teste chama processarEventosPendentes() explicitamente (determinístico)
outbox.processor.fixed-delay=3600000
outbox.processor.cleanup-cron=0 0 3 * * ?

# Logs mais silenciosos
logging.level.root=WARN
logging.level.com.ecommerce.pedidos=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.amqp=WARN
logging.level.io.github.resilience4j=INFO

# Resiliência com tempos curtos para os testes não demorarem
resilience4j.retry.instances.produtoService.wait-duration=50ms
resilience4j.circuitbreaker.instances.produtoService.wait-duration-in-open-state=1s
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=1000
